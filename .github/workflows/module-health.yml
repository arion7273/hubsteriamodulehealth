name: Module Health

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-health-reports
          path: reports/ci/
